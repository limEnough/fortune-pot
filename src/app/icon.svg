  <path d="M252 40 L268 82 L312 92 L268 102 L252 150 L236 102 L192 92 L236 82 Z" fill="url(#star)"/>
  <circle cx="246" cy="82" r="6" fill="#fffdf3" opacity=".85"/>

  <!-- 반짝임 -->
  <path d="M132 170 l7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7 z" fill="#fcd34d" opacity=".92"/>
  <circle cx="372" cy="158" r="8" fill="#f0abfc"/>
  <circle cx="398" cy="250" r="5" fill="#ffffff" opacity=".8"/>
