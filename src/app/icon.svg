  <!-- 배경 -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <ellipse cx="256" cy="250" rx="205" ry="205" fill="url(#glow)"/>

  <!-- 모자 몸통(살짝 휘어진 고깔) -->
  <path d="M150 360 Q160 250 210 168 Q238 124 252 92 Q272 130 306 212 Q344 300 366 360 Q256 392 150 360 Z" fill="url(#hat)"/>
  <!-- 왼쪽 하이라이트 -->
