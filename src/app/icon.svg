    <radialGradient id="star" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#fff6d5"/>
      <stop offset="45%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f0a930"/>
    </radialGradient>
