<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="포춘팟 마법모자 아이콘">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#3a2270"/>
      <stop offset="55%" stop-color="#1e1142"/>
      <stop offset="100%" stop-color="#120a28"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#c79bff" stop-opacity=".75"/>
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hat" x1="22%" y1="4%" x2="78%" y2="100%">
      <stop offset="0%" stop-color="#c8a8ff"/>
      <stop offset="52%" stop-color="#8b5cf6"/>
