  <!-- 모자 밴드 -->
  <path d="M186 318 Q256 348 330 316 L322 344 Q256 372 194 346 Z" fill="#3a1f7a" opacity=".55"/>

  <!-- 챙 -->
  <ellipse cx="256" cy="366" rx="162" ry="36" fill="url(#brim)"/>
  <ellipse cx="256" cy="360" rx="162" ry="34" fill="url(#brim)"/>
  <path d="M110 360 Q256 392 402 360" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="5" stroke-linecap="round"/>

