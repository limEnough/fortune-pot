<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -160 320 520" width="320" height="520" class="fp-root fp-wood" data-element="wood" role="img" aria-label="오행 목(木) 기본 캐릭터 - 성장·호기심">
  <title>목(木) · 새싹 — 성장·호기심</title>

  <defs>
    <radialGradient id="g-body-wood" cx="36%" cy="24%" r="80%">
      <stop offset="0%"   stop-color="#C0F3CC"/>
      <stop offset="44%"  stop-color="#63D28C"/>
      <stop offset="100%" stop-color="#41B270"/>
    </radialGradient>
    <radialGradient id="g-rim-wood" cx="50%" cy="96%" r="58%">
      <stop offset="0%"   stop-color="#C0F3CC" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#C0F3CC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-occl-wood" cx="50%" cy="104%" r="46%">
      <stop offset="0%"   stop-color="#2E8A56" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#2E8A56" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-gloss-wood" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".78"/>
      <stop offset="70%"  stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-gem-wood" cx="50%" cy="28%" r="70%">
      <stop offset="0%"   stop-color="#F2FFDC"/>
      <stop offset="62%"  stop-color="#D6FF9B"/>
      <stop offset="100%" stop-color="#D6FF9B" stop-opacity=".5"/>
    </radialGradient>
    <linearGradient id="g-tuft-wood" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%"   stop-color="#D6FF9B"/>
      <stop offset="100%" stop-color="#F2FFDC"/>
    </linearGradient>
    <linearGradient id="g-foot-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#41B270"/>
      <stop offset="100%" stop-color="#2E8A56"/>
    </linearGradient>
    <radialGradient id="g-blush-wood" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF7FA8" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#FF7FA8" stop-opacity="0"/>
    </radialGradient>

    <filter id="f-aura-wood" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="f-glow-wood" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-soft-wood" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="f-clay-wood" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="3" seed="9"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="c-body-wood"><path d="M160 302 C96 302 62 266 62 212 C62 156 98 112 160 112 C222 112 258 156 258 212 C258 266 224 302 160 302 Z"/></clipPath>
    
  </defs>
  <style><![CDATA[
    .fp-wood{--fp-bounce:cubic-bezier(.22,.9,.36,1);}
    .fp-wood .fp-hit{cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .fp-wood .fp-char{transform-box:view-box;transform-origin:160px 330px;}
    .fp-wood .fp-idle{transform-box:view-box;transform-origin:160px 330px;
             animation:fp-breathe-wood 3.4s ease-in-out infinite;}
    .fp-wood .fp-eyes{transform-box:view-box;transform-origin:160px 214px;
             animation:fp-blink 4.8s ease-in-out infinite;}
    .fp-wood .fp-shadow{transform-box:view-box;transform-origin:160px 344px;}
    .fp-wood .fp-aura{transform-box:view-box;transform-origin:160px 214px;
             animation:fp-aura 3.4s ease-in-out infinite;}
    .fp-wood .fp-spark{transform-box:view-box;animation:fp-twinkle 2.6s ease-in-out infinite;}
    .fp-wood .fp-spark-b{animation-delay:1.1s;}

    @keyframes fp-breathe-wood{
      0%,100%{transform:translateY(0) scale(1,1);}
      50%{transform:translateY(-4px) scale(0.99,1.014);}
    }
    @keyframes fp-aura{
      0%,100%{opacity:.24;transform:scale(1);}
      50%{opacity:.36;transform:scale(1.05);}
    }
    @keyframes fp-twinkle{
      0%,100%{opacity:.35;transform:scale(.8);}
      50%{opacity:1;transform:scale(1.12);}
    }
    @keyframes fp-blink{
      0%,90%,100%{transform:scaleY(1);}
      94%{transform:scaleY(.06);}
    }

    /* 클릭·터치 시 튀어오르기 — 오행별 리듬 */
    .fp-wood .fp-char.fp-pop{animation:fp-pop-wood 980ms var(--fp-bounce);}
    .fp-wood .fp-char.fp-pop .fp-idle{animation:none;}
    .fp-wood .fp-shadow.fp-pop{animation:fp-shadow-wood 980ms var(--fp-bounce);}
    .fp-wood .fp-char.fp-pop .fp-eyes{animation:fp-squint-wood 980ms ease-out;}
    .fp-wood .fp-char.fp-pop .fp-mouth{animation:fp-mouth-wood 980ms ease-out;}

    @keyframes fp-pop-wood{
      0%  {transform:translateY(0) scale(1,1);}
      10% {transform:translateY(6px) scale(1.13,.87);}
      26% {transform:translateY(-60px) scale(.76,1.3);}
      42% {transform:translateY(-74px) scale(.88,1.16);}
      60% {transform:translateY(-22px) scale(.96,1.07);}
      76% {transform:translateY(3px) scale(1.17,.85);}
      88% {transform:translateY(-8px) scale(.97,1.04);}
      100%{transform:translateY(0) scale(1,1);}
    }
    @keyframes fp-shadow-wood{
      0%{transform:scale(1);opacity:.5;} 10%{transform:scale(1.1);opacity:.54;}
      42%{transform:scale(.55);opacity:.16;} 60%{transform:scale(.78);opacity:.3;}
      76%{transform:scale(1.12);opacity:.54;} 100%{transform:scale(1);opacity:.5;}
    }
    @keyframes fp-squint-wood{
      0%{transform:scaleY(1);} 14%{transform:scaleY(.6);}
      34%{transform:scaleY(1.24);} 64%{transform:scaleY(1.1);}
      100%{transform:scaleY(1);}
    }
    @keyframes fp-mouth-wood{
      0%{transform:scale(1);} 26%{transform:scale(1.6,1.6);}
      60%{transform:scale(.88,.9);} 100%{transform:scale(1);}
    }
    @media (prefers-reduced-motion:reduce){
      .fp-wood .fp-idle,.fp-wood .fp-eyes,.fp-wood .fp-aura,.fp-wood .fp-spark{animation:none;}
    }
  ]]></style>

  <ellipse class="fp-aura" cx="160" cy="214" rx="112" ry="106"
           fill="#63D28C" opacity=".26" filter="url(#f-aura-wood)"/>

  <ellipse class="fp-shadow" cx="160" cy="344" rx="72" ry="12"
           fill="#2E8A56" opacity=".5" filter="url(#f-soft-wood)"/>

  <g class="fp-char">
    <g class="fp-idle">
      
      <g class="fp-crown">
        <path d="M160 118 C157 96 157 80 160 62" stroke="#3FA96B" stroke-width="11"
              stroke-linecap="round" fill="none"/>
        <path d="M158 82 C134 76 116 52 121 28 C147 26 164 46 165 72 Z" fill="#7FE0A0"/>
        <path d="M162 94 C186 88 206 68 203 44 C179 42 161 60 157 84 Z" fill="#A8F2BE"/>
        <path d="M146 58 C136 50 129 40 126 32" stroke="#4FBE7E" stroke-width="4"
              stroke-linecap="round" fill="none" opacity=".65"/>
        <path d="M176 72 C186 64 193 55 196 48" stroke="#6FD394" stroke-width="4"
              stroke-linecap="round" fill="none" opacity=".6"/>
      </g>

      <g class="fp-feet">
        <rect x="104" y="292" width="50" height="42" rx="21" fill="url(#g-foot-wood)"/>
        <rect x="166" y="292" width="50" height="42" rx="21" fill="url(#g-foot-wood)"/>
        <ellipse cx="129" cy="302" rx="16" ry="5" fill="#FFFFFF" opacity=".28"/>
        <ellipse cx="191" cy="302" rx="16" ry="5" fill="#FFFFFF" opacity=".28"/>
      </g>

      <g class="fp-body">
        <path d="M160 302 C96 302 62 266 62 212 C62 156 98 112 160 112 C222 112 258 156 258 212 C258 266 224 302 160 302 Z" fill="url(#g-body-wood)"/>
        <g clip-path="url(#c-body-wood)">
          <path d="M160 302 C96 302 62 266 62 212 C62 156 98 112 160 112 C222 112 258 156 258 212 C258 266 224 302 160 302 Z" fill="url(#g-occl-wood)"/>
          <path d="M160 302 C96 302 62 266 62 212 C62 156 98 112 160 112 C222 112 258 156 258 212 C258 266 224 302 160 302 Z" fill="url(#g-rim-wood)"/>
          <ellipse cx="118" cy="164" rx="52" ry="40"
                   transform="rotate(-24 118 164)" fill="url(#g-gloss-wood)"/>
          <ellipse cx="107" cy="152" rx="17" ry="11"
                   transform="rotate(-24 107 152)" fill="#FFFFFF" opacity=".82"/>
          <ellipse cx="132" cy="134" rx="7" ry="5"
                   transform="rotate(-24 132 134)" fill="#FFFFFF" opacity=".6"/>
          <rect x="0" y="0" width="320" height="360" filter="url(#f-clay-wood)"
                opacity=".07" style="mix-blend-mode:overlay"/>
        </g>
      </g>

      <g class="fp-blush">
        <ellipse cx="98" cy="236" rx="20" ry="13" fill="url(#g-blush-wood)"/>
        <ellipse cx="222" cy="236" rx="20" ry="13" fill="url(#g-blush-wood)"/>
      </g>

      <g class="fp-brow" stroke="#2A1B4D" stroke-width="6" stroke-linecap="round" fill="none"><path d="M115 176 Q130 164 144 175"/><path d="M176 175 Q190 164 205 176"/></g>

      <!-- 표정 : 크고 동그란 눈 + 둥근 눈썹 + 감탄하는 입 -->
      <g class="fp-eyes">
        <ellipse cx="130" cy="214" rx="22.5" ry="26" fill="#2A1B4D"/>
        <ellipse cx="190" cy="214" rx="22.5" ry="26" fill="#2A1B4D"/>
        <circle cx="125" cy="203.6" r="7.2" fill="#FFFFFF"/>
        <circle cx="185" cy="203.6" r="7.2" fill="#FFFFFF"/>
        <circle cx="137" cy="219.7" r="3.6" fill="#FFFFFF" opacity=".85"/>
        <circle cx="197" cy="219.7" r="3.6" fill="#FFFFFF" opacity=".85"/>
      </g>

      <g class="fp-mouth" style="transform-box:view-box;transform-origin:160px 250px">
        <ellipse cx="160" cy="254" rx="7" ry="9" fill="#2A1B4D"/><ellipse cx="160" cy="259" rx="4" ry="4" fill="#FF8FA8" opacity=".8"/>
      </g>

      <g class="fp-gem" filter="url(#f-glow-wood)">
        <ellipse cx="160" cy="274" rx="11.5" ry="13.5" fill="url(#g-gem-wood)"/>
        <ellipse cx="156" cy="269" rx="3.6" ry="4.5" fill="#FFFFFF" opacity=".85"/>
      </g>

      <g class="fp-spark" filter="url(#f-glow-wood)">
        <path d="M0 -11 C1.7 -3.9 3.9 -1.7 11 0 C3.9 1.7 1.7 3.9 0 11 C-1.7 3.9 -3.9 1.7 -11 0 C-3.9 -1.7 -1.7 -3.9 0 -11 Z" fill="#FFD84D" transform="translate(252,118) scale(1.15)"/>
      </g>
      <g class="fp-spark fp-spark-b" filter="url(#f-glow-wood)">
        <path d="M0 -11 C1.7 -3.9 3.9 -1.7 11 0 C3.9 1.7 1.7 3.9 0 11 C-1.7 3.9 -3.9 1.7 -11 0 C-3.9 -1.7 -1.7 -3.9 0 -11 Z" fill="#FFD84D" transform="translate(64,158) scale(.72)"/>
      </g>
    </g>
  </g>

  <rect class="fp-hit" x="0" y="-160" width="320" height="520" fill="transparent"
        tabindex="0" role="button" aria-label="목 캐릭터 새싹 쓰다듬기"/>
  <script><![CDATA[
    (function(){
      var s = document.currentScript;
      var svg = s.ownerSVGElement || s.parentNode;
      var char = svg.querySelector('.fp-char');
      var shadow = svg.querySelector('.fp-shadow');
      var hit = svg.querySelector('.fp-hit');
      if(!char || !hit) return;
      function pop(){
        char.classList.remove('fp-pop');
        shadow && shadow.classList.remove('fp-pop');
        void char.getBoundingClientRect();
        char.classList.add('fp-pop');
        shadow && shadow.classList.add('fp-pop');
      }
      char.addEventListener('animationend', function(e){
        if(e.animationName.indexOf('fp-pop-') === 0) char.classList.remove('fp-pop');
      });
      shadow && shadow.addEventListener('animationend', function(e){
        if(e.animationName.indexOf('fp-shadow-') === 0) shadow.classList.remove('fp-pop');
      });
      hit.addEventListener('pointerdown', pop);
      hit.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pop(); }
      });
    })();
  ]]></script>
</svg>
