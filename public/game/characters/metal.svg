<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -160 320 520" width="320" height="520" class="fp-root fp-metal" data-element="metal" role="img" aria-label="오행 금(金) 기본 캐릭터 - 결단·의리·냉철">
  <title>금(金) · 차랑 — 결단·의리·냉철</title>

  <defs>
    <radialGradient id="g-body-metal" cx="36%" cy="24%" r="80%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="44%"  stop-color="#E4EAF6"/>
      <stop offset="100%" stop-color="#C4CFE4"/>
    </radialGradient>
    <radialGradient id="g-rim-metal" cx="50%" cy="96%" r="58%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-occl-metal" cx="50%" cy="104%" r="46%">
      <stop offset="0%"   stop-color="#98A6C2" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#98A6C2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-gloss-metal" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".78"/>
      <stop offset="70%"  stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-gem-metal" cx="50%" cy="28%" r="70%">
      <stop offset="0%"   stop-color="#FFF3C4"/>
      <stop offset="62%"  stop-color="#FFD84D"/>
      <stop offset="100%" stop-color="#FFD84D" stop-opacity=".5"/>
    </radialGradient>
    <linearGradient id="g-tuft-metal" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%"   stop-color="#FFD84D"/>
      <stop offset="100%" stop-color="#FFF3C4"/>
    </linearGradient>
    <linearGradient id="g-foot-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9D3E6"/>
      <stop offset="100%" stop-color="#98A6C2"/>
    </linearGradient>
    <radialGradient id="g-blush-metal" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF7FA8" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#FF7FA8" stop-opacity="0"/>
    </radialGradient>

    <filter id="f-aura-metal" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="f-glow-metal" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-soft-metal" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="f-clay-metal" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="3" seed="9"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="c-body-metal"><path d="M160 302 C90 302 54 264 54 214 C54 158 96 116 160 116 C224 116 266 158 266 214 C266 264 230 302 160 302 Z"/></clipPath>
    
  </defs>
  <style><![CDATA[
    .fp-metal{--fp-bounce:cubic-bezier(.18,.92,.24,1);}
    .fp-metal .fp-hit{cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .fp-metal .fp-char{transform-box:view-box;transform-origin:160px 330px;}
    .fp-metal .fp-idle{transform-box:view-box;transform-origin:160px 330px;
             animation:fp-breathe-metal 3.6s ease-in-out infinite;}
    .fp-metal .fp-eyes{transform-box:view-box;transform-origin:160px 216px;
             animation:fp-blink 5.6s ease-in-out infinite;}
    .fp-metal .fp-shadow{transform-box:view-box;transform-origin:160px 344px;}
    .fp-metal .fp-aura{transform-box:view-box;transform-origin:160px 214px;
             animation:fp-aura 3.6s ease-in-out infinite;}
    .fp-metal .fp-spark{transform-box:view-box;animation:fp-twinkle 2.6s ease-in-out infinite;}
    .fp-metal .fp-spark-b{animation-delay:1.1s;}

    @keyframes fp-breathe-metal{
      0%,100%{transform:translateY(0) scale(1,1);}
      50%{transform:translateY(-2px) scale(0.995,1.008);}
    }
    @keyframes fp-aura{
      0%,100%{opacity:.24;transform:scale(1);}
      50%{opacity:.36;transform:scale(1.05);}
    }
    @keyframes fp-twinkle{
      0%,100%{opacity:.35;transform:scale(.8);}
      50%{opacity:1;transform:scale(1.12);}
    }
    @keyframes fp-blink{
      0%,90%,100%{transform:scaleY(1);}
      94%{transform:scaleY(.06);}
    }

    /* 클릭·터치 시 튀어오르기 — 오행별 리듬 */
    .fp-metal .fp-char.fp-pop{animation:fp-pop-metal 640ms var(--fp-bounce);}
    .fp-metal .fp-char.fp-pop .fp-idle{animation:none;}
    .fp-metal .fp-shadow.fp-pop{animation:fp-shadow-metal 640ms var(--fp-bounce);}
    .fp-metal .fp-char.fp-pop .fp-eyes{animation:fp-squint-metal 640ms ease-out;}
    .fp-metal .fp-char.fp-pop .fp-mouth{animation:fp-mouth-metal 640ms ease-out;}

    @keyframes fp-pop-metal{
      0%  {transform:translateY(0) scale(1,1);}
      12% {transform:translateY(3px) scale(1.1,.9);}
      32% {transform:translateY(-50px) scale(.93,1.09);}
      52% {transform:translateY(-52px) scale(1,1);}
      74% {transform:translateY(0) scale(1.09,.91);}
      88% {transform:translateY(0) scale(.99,1.01);}
      100%{transform:translateY(0) scale(1,1);}
    }
    @keyframes fp-shadow-metal{
      0%{transform:scale(1);opacity:.5;} 12%{transform:scale(1.08);opacity:.54;}
      42%{transform:scale(.6);opacity:.2;} 74%{transform:scale(1.06);opacity:.52;}
      100%{transform:scale(1);opacity:.5;}
    }
    @keyframes fp-squint-metal{
      0%{transform:scaleY(1);} 18%{transform:scaleY(.28);}
      40%{transform:scaleY(1);} 100%{transform:scaleY(1);}
    }
    @keyframes fp-mouth-metal{
      0%{transform:scale(1);} 28%{transform:scale(1.14,1.1);}
      62%{transform:scale(.96,.96);} 100%{transform:scale(1);}
    }
    @media (prefers-reduced-motion:reduce){
      .fp-metal .fp-idle,.fp-metal .fp-eyes,.fp-metal .fp-aura,.fp-metal .fp-spark{animation:none;}
    }
  ]]></style>

  <ellipse class="fp-aura" cx="160" cy="214" rx="112" ry="106"
           fill="#E4EAF6" opacity=".26" filter="url(#f-aura-metal)"/>

  <ellipse class="fp-shadow" cx="160" cy="344" rx="72" ry="12"
           fill="#98A6C2" opacity=".5" filter="url(#f-soft-metal)"/>

  <g class="fp-char">
    <g class="fp-idle">
      
      <g class="fp-crown">
        <g transform="rotate(-18 158 84)">
          <mask id="m-moon-metal">
            <circle cx="158" cy="84" r="34" fill="#FFFFFF"/>
            <circle cx="177" cy="72" r="29" fill="#000000"/>
          </mask>
          <circle cx="158" cy="84" r="34" fill="url(#g-tuft-metal)" mask="url(#m-moon-metal)"/>
          <mask id="m-moon2-metal">
            <circle cx="158" cy="84" r="27" fill="#FFFFFF"/>
            <circle cx="174" cy="75" r="25" fill="#000000"/>
          </mask>
          <circle cx="158" cy="84" r="27" fill="#FFF6D8" opacity=".6" mask="url(#m-moon2-metal)"/>
        </g>
        <path d="M204 74 c2.2 8.8 5.2 11.8 14 14 c-8.8 2.2 -11.8 5.2 -14 14
                 c-2.2 -8.8 -5.2 -11.8 -14 -14 c8.8 -2.2 11.8 -5.2 14 -14 Z"
              fill="#FFE79A"/>
      </g>

      <g class="fp-feet">
        <rect x="104" y="292" width="50" height="42" rx="21" fill="url(#g-foot-metal)"/>
        <rect x="166" y="292" width="50" height="42" rx="21" fill="url(#g-foot-metal)"/>
        <ellipse cx="129" cy="302" rx="16" ry="5" fill="#FFFFFF" opacity=".28"/>
        <ellipse cx="191" cy="302" rx="16" ry="5" fill="#FFFFFF" opacity=".28"/>
      </g>

      <g class="fp-body">
        <path d="M160 302 C90 302 54 264 54 214 C54 158 96 116 160 116 C224 116 266 158 266 214 C266 264 230 302 160 302 Z" fill="url(#g-body-metal)"/>
        <g clip-path="url(#c-body-metal)">
          <path d="M160 302 C90 302 54 264 54 214 C54 158 96 116 160 116 C224 116 266 158 266 214 C266 264 230 302 160 302 Z" fill="url(#g-occl-metal)"/>
          <path d="M160 302 C90 302 54 264 54 214 C54 158 96 116 160 116 C224 116 266 158 266 214 C266 264 230 302 160 302 Z" fill="url(#g-rim-metal)"/>
          <ellipse cx="118" cy="168" rx="52" ry="40"
                   transform="rotate(-24 118 168)" fill="url(#g-gloss-metal)"/>
          <ellipse cx="107" cy="156" rx="17" ry="11"
                   transform="rotate(-24 107 156)" fill="#FFFFFF" opacity=".82"/>
          <ellipse cx="132" cy="138" rx="7" ry="5"
                   transform="rotate(-24 132 138)" fill="#FFFFFF" opacity=".6"/>
          <rect x="0" y="0" width="320" height="360" filter="url(#f-clay-metal)"
                opacity=".07" style="mix-blend-mode:overlay"/>
        </g>
      </g>

      <g class="fp-blush">
        <ellipse cx="98" cy="238" rx="20" ry="13" fill="url(#g-blush-metal)"/>
        <ellipse cx="222" cy="238" rx="20" ry="13" fill="url(#g-blush-metal)"/>
      </g>

      <g class="fp-brow" stroke="#2A1B4D" stroke-width="6" stroke-linecap="round" fill="none"><path d="M117 178 L142 176"/><path d="M203 178 L178 176"/></g>

      <!-- 표정 : 야무진 눈 + 직선 눈썹 + 단정한 미소 -->
      <g class="fp-eyes">
        <ellipse cx="130" cy="216" rx="20" ry="18.5" fill="#2A1B4D"/>
        <ellipse cx="190" cy="216" rx="20" ry="18.5" fill="#2A1B4D"/>
        <circle cx="125" cy="212.3" r="7.2" fill="#FFFFFF"/>
        <circle cx="185" cy="212.3" r="7.2" fill="#FFFFFF"/>
        <circle cx="137" cy="223.8" r="3.6" fill="#FFFFFF" opacity=".85"/>
        <circle cx="197" cy="223.8" r="3.6" fill="#FFFFFF" opacity=".85"/>
      </g>

      <g class="fp-mouth" style="transform-box:view-box;transform-origin:160px 246px">
        <path d="M146 247 Q160 255 174 247" stroke="#2A1B4D" stroke-width="5" stroke-linecap="round" fill="none"/>
      </g>

      <g class="fp-gem" filter="url(#f-glow-metal)">
        <ellipse cx="160" cy="270" rx="11.5" ry="13.5" fill="url(#g-gem-metal)"/>
        <ellipse cx="156" cy="265" rx="3.6" ry="4.5" fill="#FFFFFF" opacity=".85"/>
      </g>

      <g class="fp-spark" filter="url(#f-glow-metal)">
        <path d="M0 -11 C1.7 -3.9 3.9 -1.7 11 0 C3.9 1.7 1.7 3.9 0 11 C-1.7 3.9 -3.9 1.7 -11 0 C-3.9 -1.7 -1.7 -3.9 0 -11 Z" fill="#FFD84D" transform="translate(252,122) scale(1.15)"/>
      </g>
      <g class="fp-spark fp-spark-b" filter="url(#f-glow-metal)">
        <path d="M0 -11 C1.7 -3.9 3.9 -1.7 11 0 C3.9 1.7 1.7 3.9 0 11 C-1.7 3.9 -3.9 1.7 -11 0 C-3.9 -1.7 -1.7 -3.9 0 -11 Z" fill="#FFD84D" transform="translate(64,162) scale(.72)"/>
      </g>
    </g>
  </g>

  <rect class="fp-hit" x="0" y="-160" width="320" height="520" fill="transparent"
        tabindex="0" role="button" aria-label="금 캐릭터 차랑 쓰다듬기"/>
  <script><![CDATA[
    (function(){
      var s = document.currentScript;
      var svg = s.ownerSVGElement || s.parentNode;
      var char = svg.querySelector('.fp-char');
      var shadow = svg.querySelector('.fp-shadow');
      var hit = svg.querySelector('.fp-hit');
      if(!char || !hit) return;
      function pop(){
        char.classList.remove('fp-pop');
        shadow && shadow.classList.remove('fp-pop');
        void char.getBoundingClientRect();
        char.classList.add('fp-pop');
        shadow && shadow.classList.add('fp-pop');
      }
      char.addEventListener('animationend', function(e){
        if(e.animationName.indexOf('fp-pop-') === 0) char.classList.remove('fp-pop');
      });
      shadow && shadow.addEventListener('animationend', function(e){
        if(e.animationName.indexOf('fp-shadow-') === 0) shadow.classList.remove('fp-pop');
      });
      hit.addEventListener('pointerdown', pop);
      hit.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pop(); }
      });
    })();
  ]]></script>
</svg>
