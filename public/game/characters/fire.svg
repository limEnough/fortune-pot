<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -160 320 520" width="320" height="520" class="fp-root fp-fire" data-element="fire" role="img" aria-label="오행 화(火) 기본 캐릭터 - 열정·호기로움">
  <title>화(火) · 부리 — 열정·호기로움</title>

  <defs>
    <radialGradient id="g-body-fire" cx="36%" cy="24%" r="80%">
      <stop offset="0%"   stop-color="#FFC3AC"/>
      <stop offset="44%"  stop-color="#FF8072"/>
      <stop offset="100%" stop-color="#F05C68"/>
    </radialGradient>
    <radialGradient id="g-rim-fire" cx="50%" cy="96%" r="58%">
      <stop offset="0%"   stop-color="#FFC3AC" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FFC3AC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-occl-fire" cx="50%" cy="104%" r="46%">
      <stop offset="0%"   stop-color="#C93F58" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#C93F58" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-gloss-fire" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".78"/>
      <stop offset="70%"  stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-gem-fire" cx="50%" cy="28%" r="70%">
      <stop offset="0%"   stop-color="#FFF3C4"/>
      <stop offset="62%"  stop-color="#FFD84D"/>
      <stop offset="100%" stop-color="#FFD84D" stop-opacity=".5"/>
    </radialGradient>
    <linearGradient id="g-tuft-fire" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%"   stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#FFE47A"/>
    </linearGradient>
    <linearGradient id="g-foot-fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9576A"/>
      <stop offset="100%" stop-color="#BF3B54"/>
    </linearGradient>
    <radialGradient id="g-blush-fire" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF7FA8" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#FF7FA8" stop-opacity="0"/>
    </radialGradient>

    <filter id="f-aura-fire" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="f-glow-fire" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-soft-fire" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="f-clay-fire" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="3" seed="9"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="c-body-fire"><path d="M160 302 C92 302 58 266 58 212 C58 154 96 110 160 110 C224 110 262 154 262 212 C262 266 228 302 160 302 Z"/></clipPath>
    
  </defs>
  <style><![CDATA[
    .fp-fire{--fp-bounce:cubic-bezier(.26,.86,.4,1);}
    .fp-fire .fp-hit{cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .fp-fire .fp-char{transform-box:view-box;transform-origin:160px 330px;}
    .fp-fire .fp-idle{transform-box:view-box;transform-origin:160px 330px;
             animation:fp-breathe-fire 3.0s ease-in-out infinite;}
    .fp-fire .fp-eyes{transform-box:view-box;transform-origin:160px 214px;
             animation:fp-blink 4.2s ease-in-out infinite;}
    .fp-fire .fp-shadow{transform-box:view-box;transform-origin:160px 344px;}
    .fp-fire .fp-aura{transform-box:view-box;transform-origin:160px 214px;
             animation:fp-aura 3.0s ease-in-out infinite;}
    .fp-fire .fp-spark{transform-box:view-box;animation:fp-twinkle 2.6s ease-in-out infinite;}
    .fp-fire .fp-spark-b{animation-delay:1.1s;}

    @keyframes fp-breathe-fire{
      0%,100%{transform:translateY(0) scale(1,1);}
      50%{transform:translateY(-4px) scale(0.985,1.018);}
    }
    @keyframes fp-aura{
      0%,100%{opacity:.24;transform:scale(1);}
      50%{opacity:.36;transform:scale(1.05);}
    }
    @keyframes fp-twinkle{
      0%,100%{opacity:.35;transform:scale(.8);}
      50%{opacity:1;transform:scale(1.12);}
    }
    @keyframes fp-blink{
      0%,90%,100%{transform:scaleY(1);}
      94%{transform:scaleY(.06);}
    }

    /* 클릭·터치 시 튀어오르기 — 오행별 리듬 */
    .fp-fire .fp-char.fp-pop{animation:fp-pop-fire 900ms var(--fp-bounce);}
    .fp-fire .fp-char.fp-pop .fp-idle{animation:none;}
    .fp-fire .fp-shadow.fp-pop{animation:fp-shadow-fire 900ms var(--fp-bounce);}
    .fp-fire .fp-char.fp-pop .fp-eyes{animation:fp-squint-fire 900ms ease-out;}
    .fp-fire .fp-char.fp-pop .fp-mouth{animation:fp-mouth-fire 900ms ease-out;}

    @keyframes fp-pop-fire{
      0%  {transform:translateY(0) rotate(0deg) scale(1,1);}
      8%  {transform:translateY(5px) rotate(0deg) scale(1.19,.81);}
      22% {transform:translateY(-74px) rotate(-5deg) scale(.85,1.19);}
      36% {transform:translateY(-82px) rotate(4deg) scale(.96,1.05);}
      50% {transform:translateY(3px) rotate(0deg) scale(1.2,.82);}
      62% {transform:translateY(-40px) rotate(3deg) scale(.9,1.12);}
      76% {transform:translateY(0) rotate(0deg) scale(1.14,.88);}
      86% {transform:translateY(-12px) rotate(-1deg) scale(.97,1.04);}
      94% {transform:translateY(0) rotate(0deg) scale(1.04,.96);}
      100%{transform:translateY(0) rotate(0deg) scale(1,1);}
    }
    @keyframes fp-shadow-fire{
      0%{transform:scale(1);opacity:.5;} 8%{transform:scale(1.14);opacity:.56;}
      30%{transform:scale(.5);opacity:.14;} 50%{transform:scale(1.14);opacity:.56;}
      62%{transform:scale(.68);opacity:.24;} 76%{transform:scale(1.08);opacity:.52;}
      100%{transform:scale(1);opacity:.5;}
    }
    @keyframes fp-squint-fire{
      0%{transform:scaleY(1);} 10%{transform:scaleY(.35);}
      30%{transform:scaleY(1.14);} 58%{transform:scaleY(.6);}
      100%{transform:scaleY(1);}
    }
    @keyframes fp-mouth-fire{
      0%{transform:scale(1);} 22%{transform:scale(1.5,1.7);}
      56%{transform:scale(.9,.82);} 100%{transform:scale(1);}
    }
    @media (prefers-reduced-motion:reduce){
      .fp-fire .fp-idle,.fp-fire .fp-eyes,.fp-fire .fp-aura,.fp-fire .fp-spark{animation:none;}
    }
  ]]></style>

  <ellipse class="fp-aura" cx="160" cy="214" rx="112" ry="106"
           fill="#FF8072" opacity=".26" filter="url(#f-aura-fire)"/>

  <ellipse class="fp-shadow" cx="160" cy="344" rx="72" ry="12"
           fill="#C93F58" opacity=".5" filter="url(#f-soft-fire)"/>

  <g class="fp-char">
    <g class="fp-idle">
      
      <g class="fp-crown">
        <path d="M148 118 C134 100 134 80 147 58 C157 76 160 92 156 118 Z" fill="url(#g-tuft-fire)"/>
        <path d="M176 118 C190 102 194 84 183 62 C172 80 168 98 172 118 Z" fill="url(#g-tuft-fire)"/>
        <path d="M162 118 C148 94 151 62 166 36 C182 62 180 96 170 118 Z" fill="url(#g-tuft-fire)"/>
        <path d="M164 112 C156 94 158 74 166 58 C174 76 172 98 166 112 Z" fill="#FFF3C8" opacity=".85"/>
      </g>

      <g class="fp-feet">
        <rect x="104" y="292" width="50" height="42" rx="21" fill="url(#g-foot-fire)"/>
        <rect x="166" y="292" width="50" height="42" rx="21" fill="url(#g-foot-fire)"/>
        <ellipse cx="129" cy="302" rx="16" ry="5" fill="#FFFFFF" opacity=".28"/>
        <ellipse cx="191" cy="302" rx="16" ry="5" fill="#FFFFFF" opacity=".28"/>
      </g>

      <g class="fp-body">
        <path d="M160 302 C92 302 58 266 58 212 C58 154 96 110 160 110 C224 110 262 154 262 212 C262 266 228 302 160 302 Z" fill="url(#g-body-fire)"/>
        <g clip-path="url(#c-body-fire)">
          <path d="M160 302 C92 302 58 266 58 212 C58 154 96 110 160 110 C224 110 262 154 262 212 C262 266 228 302 160 302 Z" fill="url(#g-occl-fire)"/>
          <path d="M160 302 C92 302 58 266 58 212 C58 154 96 110 160 110 C224 110 262 154 262 212 C262 266 228 302 160 302 Z" fill="url(#g-rim-fire)"/>
          <ellipse cx="118" cy="162" rx="52" ry="40"
                   transform="rotate(-24 118 162)" fill="url(#g-gloss-fire)"/>
          <ellipse cx="107" cy="150" rx="17" ry="11"
                   transform="rotate(-24 107 150)" fill="#FFFFFF" opacity=".82"/>
          <ellipse cx="132" cy="132" rx="7" ry="5"
                   transform="rotate(-24 132 132)" fill="#FFFFFF" opacity=".6"/>
          <rect x="0" y="0" width="320" height="360" filter="url(#f-clay-fire)"
                opacity=".07" style="mix-blend-mode:overlay"/>
        </g>
      </g>

      <g class="fp-blush">
        <ellipse cx="98" cy="236" rx="20" ry="13" fill="url(#g-blush-fire)"/>
        <ellipse cx="222" cy="236" rx="20" ry="13" fill="url(#g-blush-fire)"/>
      </g>

      <g class="fp-brow" stroke="#2A1B4D" stroke-width="6.5" stroke-linecap="round" fill="none"><path d="M115 172 Q129 167 143 176"/><path d="M205 172 Q191 167 177 176"/></g>

      <!-- 표정 : 호기로운 결의 눈썹 + 활짝 웃는 입 -->
      <g class="fp-eyes">
        <ellipse cx="130" cy="214" rx="21" ry="24" fill="#2A1B4D"/>
        <ellipse cx="190" cy="214" rx="21" ry="24" fill="#2A1B4D"/>
        <circle cx="125" cy="205.4" r="7.2" fill="#FFFFFF"/>
        <circle cx="185" cy="205.4" r="7.2" fill="#FFFFFF"/>
        <circle cx="137" cy="220.2" r="3.6" fill="#FFFFFF" opacity=".85"/>
        <circle cx="197" cy="220.2" r="3.6" fill="#FFFFFF" opacity=".85"/>
      </g>

      <g class="fp-mouth" style="transform-box:view-box;transform-origin:160px 244px">
        <path d="M138 239 Q160 270 182 239 Q160 249 138 239 Z" fill="#2A1B4D"/><path d="M150 255 Q160 265 170 255 Q160 259 150 255 Z" fill="#FF8FA8" opacity=".9"/>
      </g>

      <g class="fp-gem" filter="url(#f-glow-fire)">
        <ellipse cx="160" cy="276" rx="11.5" ry="13.5" fill="url(#g-gem-fire)"/>
        <ellipse cx="156" cy="271" rx="3.6" ry="4.5" fill="#FFFFFF" opacity=".85"/>
      </g>

      <g class="fp-spark" filter="url(#f-glow-fire)">
        <path d="M0 -11 C1.7 -3.9 3.9 -1.7 11 0 C3.9 1.7 1.7 3.9 0 11 C-1.7 3.9 -3.9 1.7 -11 0 C-3.9 -1.7 -1.7 -3.9 0 -11 Z" fill="#FFD84D" transform="translate(252,116) scale(1.15)"/>
      </g>
      <g class="fp-spark fp-spark-b" filter="url(#f-glow-fire)">
        <path d="M0 -11 C1.7 -3.9 3.9 -1.7 11 0 C3.9 1.7 1.7 3.9 0 11 C-1.7 3.9 -3.9 1.7 -11 0 C-3.9 -1.7 -1.7 -3.9 0 -11 Z" fill="#FFD84D" transform="translate(64,156) scale(.72)"/>
      </g>
    </g>
  </g>

  <rect class="fp-hit" x="0" y="-160" width="320" height="520" fill="transparent"
        tabindex="0" role="button" aria-label="화 캐릭터 부리 쓰다듬기"/>
  <script><![CDATA[
    (function(){
      var s = document.currentScript;
      var svg = s.ownerSVGElement || s.parentNode;
      var char = svg.querySelector('.fp-char');
      var shadow = svg.querySelector('.fp-shadow');
      var hit = svg.querySelector('.fp-hit');
      if(!char || !hit) return;
      function pop(){
        char.classList.remove('fp-pop');
        shadow && shadow.classList.remove('fp-pop');
        void char.getBoundingClientRect();
        char.classList.add('fp-pop');
        shadow && shadow.classList.add('fp-pop');
      }
      char.addEventListener('animationend', function(e){
        if(e.animationName.indexOf('fp-pop-') === 0) char.classList.remove('fp-pop');
      });
      shadow && shadow.addEventListener('animationend', function(e){
        if(e.animationName.indexOf('fp-shadow-') === 0) shadow.classList.remove('fp-pop');
      });
      hit.addEventListener('pointerdown', pop);
      hit.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pop(); }
      });
    })();
  ]]></script>
</svg>
