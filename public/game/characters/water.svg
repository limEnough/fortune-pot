<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -160 320 520" width="320" height="520" class="fp-root fp-water" data-element="water" role="img" aria-label="오행 수(水) 기본 캐릭터 - 지혜·유연·차분">
  <title>수(水) · 포로 — 지혜·유연·차분</title>

  <defs>
    <radialGradient id="g-body-water" cx="36%" cy="24%" r="80%">
      <stop offset="0%"   stop-color="#B6E2FF"/>
      <stop offset="44%"  stop-color="#5AA8F5"/>
      <stop offset="100%" stop-color="#3D82E4"/>
    </radialGradient>
    <radialGradient id="g-rim-water" cx="50%" cy="96%" r="58%">
      <stop offset="0%"   stop-color="#B6E2FF" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#B6E2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-occl-water" cx="50%" cy="104%" r="46%">
      <stop offset="0%"   stop-color="#2A5FB8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#2A5FB8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-gloss-water" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".78"/>
      <stop offset="70%"  stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-gem-water" cx="50%" cy="28%" r="70%">
      <stop offset="0%"   stop-color="#EAFBFF"/>
      <stop offset="62%"  stop-color="#9BE8FF"/>
      <stop offset="100%" stop-color="#9BE8FF" stop-opacity=".5"/>
    </radialGradient>
    <linearGradient id="g-tuft-water" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%"   stop-color="#9BE8FF"/>
      <stop offset="100%" stop-color="#EAFBFF"/>
    </linearGradient>
    <linearGradient id="g-foot-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A82DE"/>
      <stop offset="100%" stop-color="#2A5FB8"/>
    </linearGradient>
    <radialGradient id="g-blush-water" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF7FA8" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#FF7FA8" stop-opacity="0"/>
    </radialGradient>

    <filter id="f-aura-water" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="f-glow-water" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-soft-water" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="f-clay-water" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="3" seed="9"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="c-body-water"><path d="M160 302 C92 302 58 266 58 212 C58 162 90 126 128 102 C144 92 154 80 160 66 C166 80 176 92 192 102 C230 126 262 162 262 212 C262 266 228 302 160 302 Z"/></clipPath>
    
  </defs>
  <style><![CDATA[
    .fp-water{--fp-bounce:cubic-bezier(.34,.72,.32,1);}
    .fp-water .fp-hit{cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .fp-water .fp-char{transform-box:view-box;transform-origin:160px 330px;}
    .fp-water .fp-idle{transform-box:view-box;transform-origin:160px 330px;
             animation:fp-breathe-water 4.4s ease-in-out infinite;}
    .fp-water .fp-eyes{transform-box:view-box;transform-origin:160px 216px;
             animation:fp-blink 6.4s ease-in-out infinite;}
    .fp-water .fp-shadow{transform-box:view-box;transform-origin:160px 344px;}
    .fp-water .fp-aura{transform-box:view-box;transform-origin:160px 214px;
             animation:fp-aura 4.4s ease-in-out infinite;}
    .fp-water .fp-spark{transform-box:view-box;animation:fp-twinkle 2.6s ease-in-out infinite;}
    .fp-water .fp-spark-b{animation-delay:1.1s;}

    @keyframes fp-breathe-water{
      0%,100%{transform:translateY(0) scale(1,1);}
      50%{transform:translateY(-3px) scale(0.992,1.01);}
    }
    @keyframes fp-aura{
      0%,100%{opacity:.24;transform:scale(1);}
      50%{opacity:.36;transform:scale(1.05);}
    }
    @keyframes fp-twinkle{
      0%,100%{opacity:.35;transform:scale(.8);}
      50%{opacity:1;transform:scale(1.12);}
    }
    @keyframes fp-blink{
      0%,90%,100%{transform:scaleY(1);}
      94%{transform:scaleY(.06);}
    }

    /* 클릭·터치 시 튀어오르기 — 오행별 리듬 */
    .fp-water .fp-char.fp-pop{animation:fp-pop-water 1150ms var(--fp-bounce);}
    .fp-water .fp-char.fp-pop .fp-idle{animation:none;}
    .fp-water .fp-shadow.fp-pop{animation:fp-shadow-water 1150ms var(--fp-bounce);}
    .fp-water .fp-char.fp-pop .fp-eyes{animation:fp-squint-water 1150ms ease-out;}
    .fp-water .fp-char.fp-pop .fp-mouth{animation:fp-mouth-water 1150ms ease-out;}

    @keyframes fp-pop-water{
      0%  {transform:translateY(0) scale(1,1);}
      13% {transform:translateY(8px) scale(1.26,.77);}
      31% {transform:translateY(-34px) scale(.83,1.21);}
      47% {transform:translateY(-40px) scale(.93,1.09);}
      63% {transform:translateY(5px) scale(1.22,.81);}
      75% {transform:translateY(-14px) scale(.93,1.09);}
      85% {transform:translateY(0) scale(1.12,.9);}
      92% {transform:translateY(-4px) scale(.97,1.04);}
      100%{transform:translateY(0) scale(1,1);}
    }
    @keyframes fp-shadow-water{
      0%{transform:scale(1);opacity:.5;} 13%{transform:scale(1.18);opacity:.58;}
      40%{transform:scale(.74);opacity:.3;} 63%{transform:scale(1.16);opacity:.56;}
      80%{transform:scale(.94);opacity:.42;} 100%{transform:scale(1);opacity:.5;}
    }
    @keyframes fp-squint-water{
      0%{transform:scaleY(1);} 22%{transform:scaleY(.82);}
      55%{transform:scaleY(1.05);} 100%{transform:scaleY(1);}
    }
    @keyframes fp-mouth-water{
      0%{transform:scale(1);} 30%{transform:scale(1.16,1.2);}
      66%{transform:scale(.96,.94);} 100%{transform:scale(1);}
    }
    @media (prefers-reduced-motion:reduce){
      .fp-water .fp-idle,.fp-water .fp-eyes,.fp-water .fp-aura,.fp-water .fp-spark{animation:none;}
    }
  ]]></style>

  <ellipse class="fp-aura" cx="160" cy="214" rx="112" ry="106"
           fill="#5AA8F5" opacity=".26" filter="url(#f-aura-water)"/>

  <ellipse class="fp-shadow" cx="160" cy="344" rx="72" ry="12"
           fill="#2A5FB8" opacity=".5" filter="url(#f-soft-water)"/>

  <g class="fp-char">
    <g class="fp-idle">
      
      <g class="fp-crown">
        <circle cx="238" cy="120" r="9" fill="#9BE8FF" opacity=".8"/>
        <circle cx="258" cy="152" r="5.5" fill="#9BE8FF" opacity=".65"/>
        <circle cx="72" cy="150" r="7" fill="#9BE8FF" opacity=".7"/>
        <circle cx="235" cy="117" r="3" fill="#FFFFFF" opacity=".9"/>
      </g>

      <g class="fp-feet">
        <rect x="104" y="292" width="50" height="42" rx="21" fill="url(#g-foot-water)"/>
        <rect x="166" y="292" width="50" height="42" rx="21" fill="url(#g-foot-water)"/>
        <ellipse cx="129" cy="302" rx="16" ry="5" fill="#FFFFFF" opacity=".28"/>
        <ellipse cx="191" cy="302" rx="16" ry="5" fill="#FFFFFF" opacity=".28"/>
      </g>

      <g class="fp-body">
        <path d="M160 302 C92 302 58 266 58 212 C58 162 90 126 128 102 C144 92 154 80 160 66 C166 80 176 92 192 102 C230 126 262 162 262 212 C262 266 228 302 160 302 Z" fill="url(#g-body-water)"/>
        <g clip-path="url(#c-body-water)">
          <path d="M160 302 C92 302 58 266 58 212 C58 162 90 126 128 102 C144 92 154 80 160 66 C166 80 176 92 192 102 C230 126 262 162 262 212 C262 266 228 302 160 302 Z" fill="url(#g-occl-water)"/>
          <path d="M160 302 C92 302 58 266 58 212 C58 162 90 126 128 102 C144 92 154 80 160 66 C166 80 176 92 192 102 C230 126 262 162 262 212 C262 266 228 302 160 302 Z" fill="url(#g-rim-water)"/>
          <ellipse cx="118" cy="118" rx="52" ry="40"
                   transform="rotate(-24 118 118)" fill="url(#g-gloss-water)"/>
          <ellipse cx="107" cy="106" rx="17" ry="11"
                   transform="rotate(-24 107 106)" fill="#FFFFFF" opacity=".82"/>
          <ellipse cx="132" cy="88" rx="7" ry="5"
                   transform="rotate(-24 132 88)" fill="#FFFFFF" opacity=".6"/>
          <rect x="0" y="0" width="320" height="360" filter="url(#f-clay-water)"
                opacity=".07" style="mix-blend-mode:overlay"/>
        </g>
      </g>

      <g class="fp-blush">
        <ellipse cx="98" cy="238" rx="20" ry="13" fill="url(#g-blush-water)"/>
        <ellipse cx="222" cy="238" rx="20" ry="13" fill="url(#g-blush-water)"/>
      </g>

      

      <!-- 표정 : 반쯤 감긴 나른한 눈 + 잔잔한 미소 -->
      <g class="fp-eyes">
        <ellipse cx="130" cy="216" rx="21.5" ry="15" fill="#2A1B4D"/>
        <ellipse cx="190" cy="216" rx="21.5" ry="15" fill="#2A1B4D"/>
        <circle cx="125" cy="212.7" r="6.6" fill="#FFFFFF"/>
        <circle cx="185" cy="212.7" r="6.6" fill="#FFFFFF"/>
        <circle cx="137" cy="222.0" r="3.3" fill="#FFFFFF" opacity=".85"/>
        <circle cx="197" cy="222.0" r="3.3" fill="#FFFFFF" opacity=".85"/>
      </g>

      <g class="fp-mouth" style="transform-box:view-box;transform-origin:160px 248px">
        <path d="M151 248 Q160 257 169 248" stroke="#2A1B4D" stroke-width="5" stroke-linecap="round" fill="none"/>
      </g>

      <g class="fp-gem" filter="url(#f-glow-water)">
        <ellipse cx="160" cy="270" rx="11.5" ry="13.5" fill="url(#g-gem-water)"/>
        <ellipse cx="156" cy="265" rx="3.6" ry="4.5" fill="#FFFFFF" opacity=".85"/>
      </g>

      <g class="fp-spark" filter="url(#f-glow-water)">
        <path d="M0 -11 C1.7 -3.9 3.9 -1.7 11 0 C3.9 1.7 1.7 3.9 0 11 C-1.7 3.9 -3.9 1.7 -11 0 C-3.9 -1.7 -1.7 -3.9 0 -11 Z" fill="#FFD84D" transform="translate(252,72) scale(1.15)"/>
      </g>
      <g class="fp-spark fp-spark-b" filter="url(#f-glow-water)">
        <path d="M0 -11 C1.7 -3.9 3.9 -1.7 11 0 C3.9 1.7 1.7 3.9 0 11 C-1.7 3.9 -3.9 1.7 -11 0 C-3.9 -1.7 -1.7 -3.9 0 -11 Z" fill="#FFD84D" transform="translate(64,112) scale(.72)"/>
      </g>
    </g>
  </g>

  <rect class="fp-hit" x="0" y="-160" width="320" height="520" fill="transparent"
        tabindex="0" role="button" aria-label="수 캐릭터 포로 쓰다듬기"/>
  <script><![CDATA[
    (function(){
      var s = document.currentScript;
      var svg = s.ownerSVGElement || s.parentNode;
      var char = svg.querySelector('.fp-char');
      var shadow = svg.querySelector('.fp-shadow');
      var hit = svg.querySelector('.fp-hit');
      if(!char || !hit) return;
      function pop(){
        char.classList.remove('fp-pop');
        shadow && shadow.classList.remove('fp-pop');
        void char.getBoundingClientRect();
        char.classList.add('fp-pop');
        shadow && shadow.classList.add('fp-pop');
      }
      char.addEventListener('animationend', function(e){
        if(e.animationName.indexOf('fp-pop-') === 0) char.classList.remove('fp-pop');
      });
      shadow && shadow.addEventListener('animationend', function(e){
        if(e.animationName.indexOf('fp-shadow-') === 0) shadow.classList.remove('fp-pop');
      });
      hit.addEventListener('pointerdown', pop);
      hit.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pop(); }
      });
    })();
  ]]></script>
</svg>
