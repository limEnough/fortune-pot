<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -160 320 520" width="320" height="520" class="fp-root fp-earth" data-element="earth" role="img" aria-label="오행 토(土) 기본 캐릭터 - 안정·포용·느긋">
  <title>토(土) · 도담 — 안정·포용·느긋</title>

  <defs>
    <radialGradient id="g-body-earth" cx="36%" cy="24%" r="80%">
      <stop offset="0%"   stop-color="#FFE3A6"/>
      <stop offset="44%"  stop-color="#F5C263"/>
      <stop offset="100%" stop-color="#DDA23F"/>
    </radialGradient>
    <radialGradient id="g-rim-earth" cx="50%" cy="96%" r="58%">
      <stop offset="0%"   stop-color="#FFE3A6" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FFE3A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-occl-earth" cx="50%" cy="104%" r="46%">
      <stop offset="0%"   stop-color="#B27C2C" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#B27C2C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-gloss-earth" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".78"/>
      <stop offset="70%"  stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-gem-earth" cx="50%" cy="28%" r="70%">
      <stop offset="0%"   stop-color="#FFFAE8"/>
      <stop offset="62%"  stop-color="#FFEFC0"/>
      <stop offset="100%" stop-color="#FFEFC0" stop-opacity=".5"/>
    </radialGradient>
    <linearGradient id="g-tuft-earth" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%"   stop-color="#FFEFC0"/>
      <stop offset="100%" stop-color="#FFFAE8"/>
    </linearGradient>
    <linearGradient id="g-foot-earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DDA23F"/>
      <stop offset="100%" stop-color="#B27C2C"/>
    </linearGradient>
    <radialGradient id="g-blush-earth" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF7FA8" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#FF7FA8" stop-opacity="0"/>
    </radialGradient>

    <filter id="f-aura-earth" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="f-glow-earth" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-soft-earth" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="f-clay-earth" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="3" seed="9"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="c-body-earth"><path d="M160 304 C86 304 50 266 50 218 C50 164 96 124 160 124 C224 124 270 164 270 218 C270 266 234 304 160 304 Z"/></clipPath>
    <clipPath id="c-eye-earth"><path d="M103 189.0 L157 189.0 L157 226.5 Q130 218.0 103 226.5 Z M163 189.0 L217 189.0 L217 226.5 Q190 218.0 163 226.5 Z"/></clipPath>
  </defs>
  <style><![CDATA[
    .fp-earth{--fp-bounce:cubic-bezier(.3,.8,.3,1);}
    .fp-earth .fp-hit{cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .fp-earth .fp-char{transform-box:view-box;transform-origin:160px 330px;}
    .fp-earth .fp-idle{transform-box:view-box;transform-origin:160px 330px;
             animation:fp-breathe-earth 4.0s ease-in-out infinite;}
    .fp-earth .fp-eyes{transform-box:view-box;transform-origin:160px 222px;
             animation:fp-blink 7.2s ease-in-out infinite;}
    .fp-earth .fp-shadow{transform-box:view-box;transform-origin:160px 344px;}
    .fp-earth .fp-aura{transform-box:view-box;transform-origin:160px 214px;
             animation:fp-aura 4.0s ease-in-out infinite;}
    .fp-earth .fp-spark{transform-box:view-box;animation:fp-twinkle 2.6s ease-in-out infinite;}
    .fp-earth .fp-spark-b{animation-delay:1.1s;}

    @keyframes fp-breathe-earth{
      0%,100%{transform:translateY(0) scale(1,1);}
      50%{transform:translateY(-3px) scale(0.988,1.012);}
    }
    @keyframes fp-aura{
      0%,100%{opacity:.24;transform:scale(1);}
      50%{opacity:.36;transform:scale(1.05);}
    }
    @keyframes fp-twinkle{
      0%,100%{opacity:.35;transform:scale(.8);}
      50%{opacity:1;transform:scale(1.12);}
    }
    @keyframes fp-blink{
      0%,90%,100%{transform:scaleY(1);}
      94%{transform:scaleY(.06);}
    }

    /* 클릭·터치 시 튀어오르기 — 오행별 리듬 */
    .fp-earth .fp-char.fp-pop{animation:fp-pop-earth 1020ms var(--fp-bounce);}
    .fp-earth .fp-char.fp-pop .fp-idle{animation:none;}
    .fp-earth .fp-shadow.fp-pop{animation:fp-shadow-earth 1020ms var(--fp-bounce);}
    .fp-earth .fp-char.fp-pop .fp-eyes{animation:fp-squint-earth 1020ms ease-out;}
    .fp-earth .fp-char.fp-pop .fp-mouth{animation:fp-mouth-earth 1020ms ease-out;}

    @keyframes fp-pop-earth{
      0%  {transform:translateY(0) scale(1,1);}
      14% {transform:translateY(9px) scale(1.23,.79);}
      33% {transform:translateY(-30px) scale(.9,1.12);}
      49% {transform:translateY(-34px) scale(.97,1.04);}
      64% {transform:translateY(8px) scale(1.28,.74);}
      78% {transform:translateY(0) scale(1.14,.88);}
      90% {transform:translateY(0) scale(1.04,.96);}
      100%{transform:translateY(0) scale(1,1);}
    }
    @keyframes fp-shadow-earth{
      0%{transform:scale(1);opacity:.5;} 14%{transform:scale(1.2);opacity:.6;}
      42%{transform:scale(.78);opacity:.32;} 64%{transform:scale(1.26);opacity:.62;}
      78%{transform:scale(1.1);opacity:.54;} 100%{transform:scale(1);opacity:.5;}
    }
    @keyframes fp-squint-earth{
      0%{transform:scaleY(1);} 20%{transform:scaleY(.72);}
      64%{transform:scaleY(.86);} 100%{transform:scaleY(1);}
    }
    @keyframes fp-mouth-earth{
      0%{transform:scale(1);} 30%{transform:scale(1.3,1.34);}
      68%{transform:scale(.94,.9);} 100%{transform:scale(1);}
    }
    @media (prefers-reduced-motion:reduce){
      .fp-earth .fp-idle,.fp-earth .fp-eyes,.fp-earth .fp-aura,.fp-earth .fp-spark{animation:none;}
    }
  ]]></style>

  <ellipse class="fp-aura" cx="160" cy="214" rx="112" ry="106"
           fill="#F5C263" opacity=".26" filter="url(#f-aura-earth)"/>

  <ellipse class="fp-shadow" cx="160" cy="344" rx="72" ry="12"
           fill="#B27C2C" opacity=".5" filter="url(#f-soft-earth)"/>

  <g class="fp-char">
    <g class="fp-idle">
      
      <g class="fp-crown">
        <g stroke-linejoin="round" stroke-width="8">
          <path d="M136 132 L145 108 L155 130 Z" fill="#D3A050" stroke="#D3A050"/>
          <path d="M158 128 L172 96 L187 126 Z" fill="#E4B665" stroke="#E4B665"/>
          <path d="M172 96 L187 126 L179 128 Z" fill="#FFE7AE" stroke="#FFE7AE" stroke-width="4"/>
          <path d="M188 130 L196 112 L205 128 Z" fill="#C08F3E" stroke="#C08F3E"/>
        </g>
      </g>

      <g class="fp-feet">
        <rect x="104" y="292" width="50" height="42" rx="21" fill="url(#g-foot-earth)"/>
        <rect x="166" y="292" width="50" height="42" rx="21" fill="url(#g-foot-earth)"/>
        <ellipse cx="129" cy="302" rx="16" ry="5" fill="#FFFFFF" opacity=".28"/>
        <ellipse cx="191" cy="302" rx="16" ry="5" fill="#FFFFFF" opacity=".28"/>
      </g>

      <g class="fp-body">
        <path d="M160 304 C86 304 50 266 50 218 C50 164 96 124 160 124 C224 124 270 164 270 218 C270 266 234 304 160 304 Z" fill="url(#g-body-earth)"/>
        <g clip-path="url(#c-body-earth)">
          <path d="M160 304 C86 304 50 266 50 218 C50 164 96 124 160 124 C224 124 270 164 270 218 C270 266 234 304 160 304 Z" fill="url(#g-occl-earth)"/>
          <path d="M160 304 C86 304 50 266 50 218 C50 164 96 124 160 124 C224 124 270 164 270 218 C270 266 234 304 160 304 Z" fill="url(#g-rim-earth)"/>
          <ellipse cx="118" cy="176" rx="52" ry="40"
                   transform="rotate(-24 118 176)" fill="url(#g-gloss-earth)"/>
          <ellipse cx="107" cy="164" rx="17" ry="11"
                   transform="rotate(-24 107 164)" fill="#FFFFFF" opacity=".82"/>
          <ellipse cx="132" cy="146" rx="7" ry="5"
                   transform="rotate(-24 132 146)" fill="#FFFFFF" opacity=".6"/>
          <rect x="0" y="0" width="320" height="360" filter="url(#f-clay-earth)"
                opacity=".07" style="mix-blend-mode:overlay"/>
        </g>
      </g>

      <g class="fp-blush">
        <ellipse cx="98" cy="244" rx="20" ry="13" fill="url(#g-blush-earth)"/>
        <ellipse cx="222" cy="244" rx="20" ry="13" fill="url(#g-blush-earth)"/>
      </g>

      

      <!-- 표정 : 눈웃음 + 넉넉한 큰 미소 -->
      <g class="fp-eyes" clip-path="url(#c-eye-earth)">
        <ellipse cx="130" cy="222" rx="22" ry="25" fill="#2A1B4D"/>
        <ellipse cx="190" cy="222" rx="22" ry="25" fill="#2A1B4D"/>
        <circle cx="125" cy="210.0" r="7.2" fill="#FFFFFF"/>
        <circle cx="185" cy="210.0" r="7.2" fill="#FFFFFF"/>
        <circle cx="137" cy="225.5" r="3.6" fill="#FFFFFF" opacity=".85"/>
        <circle cx="197" cy="225.5" r="3.6" fill="#FFFFFF" opacity=".85"/>
      </g>

      <g class="fp-mouth" style="transform-box:view-box;transform-origin:160px 254px">
        <path d="M142 252 Q160 272 178 252" stroke="#2A1B4D" stroke-width="6.5" stroke-linecap="round" fill="none"/>
      </g>

      <g class="fp-gem" filter="url(#f-glow-earth)">
        <ellipse cx="160" cy="278" rx="11.5" ry="13.5" fill="url(#g-gem-earth)"/>
        <ellipse cx="156" cy="273" rx="3.6" ry="4.5" fill="#FFFFFF" opacity=".85"/>
      </g>

      <g class="fp-spark" filter="url(#f-glow-earth)">
        <path d="M0 -11 C1.7 -3.9 3.9 -1.7 11 0 C3.9 1.7 1.7 3.9 0 11 C-1.7 3.9 -3.9 1.7 -11 0 C-3.9 -1.7 -1.7 -3.9 0 -11 Z" fill="#FFD84D" transform="translate(252,130) scale(1.15)"/>
      </g>
      <g class="fp-spark fp-spark-b" filter="url(#f-glow-earth)">
        <path d="M0 -11 C1.7 -3.9 3.9 -1.7 11 0 C3.9 1.7 1.7 3.9 0 11 C-1.7 3.9 -3.9 1.7 -11 0 C-3.9 -1.7 -1.7 -3.9 0 -11 Z" fill="#FFD84D" transform="translate(64,170) scale(.72)"/>
      </g>
    </g>
  </g>

  <rect class="fp-hit" x="0" y="-160" width="320" height="520" fill="transparent"
        tabindex="0" role="button" aria-label="토 캐릭터 도담 쓰다듬기"/>
  <script><![CDATA[
    (function(){
      var s = document.currentScript;
      var svg = s.ownerSVGElement || s.parentNode;
      var char = svg.querySelector('.fp-char');
      var shadow = svg.querySelector('.fp-shadow');
      var hit = svg.querySelector('.fp-hit');
      if(!char || !hit) return;
      function pop(){
        char.classList.remove('fp-pop');
        shadow && shadow.classList.remove('fp-pop');
        void char.getBoundingClientRect();
        char.classList.add('fp-pop');
        shadow && shadow.classList.add('fp-pop');
      }
      char.addEventListener('animationend', function(e){
        if(e.animationName.indexOf('fp-pop-') === 0) char.classList.remove('fp-pop');
      });
      shadow && shadow.addEventListener('animationend', function(e){
        if(e.animationName.indexOf('fp-shadow-') === 0) shadow.classList.remove('fp-pop');
      });
      hit.addEventListener('pointerdown', pop);
      hit.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pop(); }
      });
    })();
  ]]></script>
</svg>
